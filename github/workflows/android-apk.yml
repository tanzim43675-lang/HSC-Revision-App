name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          api-level: 35

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: unzip -q 'HSCRevisionAndroid-2 (1).zip' -d android-build

      - name: Build APK
        working-directory: android-build/HSCRevisionAndroid
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HSC-Revision-debug-APK
          path: android-build/HSCRevisionAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
